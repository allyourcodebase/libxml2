name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zig-version: [latest]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - zig-version: "master"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Check Formatting
        run: zig fmt --ast-check --check .

      - name: Build
        run: zig build --summary all

      - name: Build for FreeBSD
        run: zig build -Dtarget=native-freebsd --summary all

      - name: Build for NetBSD
        run: zig build -Dtarget=native-netbsd --summary all

      - name: Build for OpenBSD
        if: matrix.zig-version == 'master'
        run: zig build -Dtarget=native-openbsd -Diconv=false --summary all
